<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TADIKOI Sous-titres</title>

  <body>
    <main>
      <h1>Sous-titres hors ligne</h1>
      <p class="intro">La transcription se fait sur le téléphone. Une fois une langue téléchargée, internet n'est plus nécessaire.</p>

      <button id="demarrer" class="principal">Démarrer les sous-titres</button>
      <p id="etat" class="etat" role="status"></p>

      <h2>Langues</h2>
      <ul id="langues"></ul>
      <p id="stockage" class="stockage"></p>

      <p class="aide">Sur les lunettes : toucher = démarrer / pause · double toucher = quitter</p>
    </main>
