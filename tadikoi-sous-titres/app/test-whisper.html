<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Whisper</title>
<style>
  :root { --fond:#121513; --texte:#e8ece8; --doux:#9aa59c; --carte:#1b201c; --bord:#2c342e; --accent:#3fbf7f; --vert:#5dff9a; --rouge:#e0806f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.45 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.35rem; margin:0 0 6px; }
  p.aide { color:var(--doux); font-size:.92rem; margin:4px 0 14px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  select, button { font:inherit; width:100%; padding:14px; border-radius:12px; border:1px solid var(--bord); background:var(--carte); color:var(--texte); }
  button.principal { background:var(--accent); color:#08130d; border:0; font-weight:700; margin-top:14px; }
  button.principal.actif { background:var(--rouge); }
  button:disabled { opacity:.5; }
  #etat { margin:12px 0 0; min-height:1.4em; font-size:.92rem; }
  #barre { height:6px; background:var(--bord); border-radius:3px; overflow:hidden; margin-top:6px; }
  #barre > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  #niveau { height:6px; background:var(--bord); border-radius:3px; overflow:hidden; margin-top:10px; }
  #niveau > div { height:100%; width:0; background:var(--vert); }
  #sortie { margin-top:16px; display:grid; gap:10px; }
  .ligne { background:#000; border-radius:12px; padding:12px 14px; }
  .texte { color:var(--vert); font-size:1.15rem; }
  .mesure { color:var(--doux); font-size:.8rem; margin-top:4px; }
  .attente .texte { color:var(--doux); font-style:italic; }
  #resume { margin-top:16px; color:var(--doux); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Test de précision : Whisper</h1>
  <p class="aide">Parlez normalement, puis faites une petite pause : chaque phrase est transcrite après la pause.
  Le délai affiché sous chaque phrase est le temps de calcul du téléphone.</p>

  <label for="modele">Modèle</label>
  <select id="modele">
    <option value="onnx-community/whisper-base">Base (environ 80 Mo, rapide)</option>
    <option value="onnx-community/whisper-small">Small (environ 250 Mo, plus précis, plus lent)</option>
    <option value="onnx-community/whisper-tiny">Tiny (environ 40 Mo, très rapide, moins précis)</option>
  </select>

  <button id="charger" class="principal">1. Télécharger le modèle</button>
  <div id="barre"><div></div></div>
  <button id="micro" class="principal" disabled>2. Démarrer l'écoute</button>
  <div id="niveau"><div></div></div>
  <p id="etat" role="status"></p>

  <div id="sortie"></div>
  <p id="resume"></p>
</main>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6';

env.allowLocalModels = false;   // modèles téléchargés depuis Hugging Face, puis gardés en cache

const $ = (id) => document.getElementById(id);
const etat = (t) => { $('etat').textContent = t; };

let transcripteur = null;
let calcul = 'wasm';
const mesures = [];

// ---------- 1. Chargement du modèle ----------
$('charger').onclick = async () => {
  $('charger').disabled = true;
  $('modele').disabled = true;
  const id = $('modele').value;
  const fichiers = new Map();
  const progression = (p) => {
    if (p.status === 'progress' && p.total) {
      fichiers.set(p.file, [p.loaded, p.total]);
      let l = 0, t = 0;
      for (const [a, b] of fichiers.values()) { l += a; t += b; }
      $('barre').firstElementChild.style.width = `${Math.round((l / t) * 100)}%`;
      etat(`Téléchargement… ${Math.round(l / 1e6)} / ${Math.round(t / 1e6)} Mo`);
    }
  };

  // WebGPU (carte graphique) si disponible, sinon calcul classique.
  try {
    if (navigator.gpu && await navigator.gpu.requestAdapter()) calcul = 'webgpu';
  } catch { /* pas de WebGPU */ }

  const options = calcul === 'webgpu'
    ? { device: 'webgpu', dtype: { encoder_model: 'fp32', decoder_model_merged: 'q4' } }
    : { device: 'wasm', dtype: 'q8' };

  try {
    etat(`Préparation (${calcul === 'webgpu' ? 'carte graphique' : 'processeur'})…`);
    transcripteur = await pipeline('automatic-speech-recognition', id, { ...options, progress_callback: progression });
  } catch (e) {
    if (calcul === 'webgpu') {
      // Repli sur le processeur si la carte graphique pose problème.
      calcul = 'wasm';
      etat('Carte graphique indisponible, passage au processeur…');
      transcripteur = await pipeline('automatic-speech-recognition', id, { device: 'wasm', dtype: 'q8', progress_callback: progression });
    } else {
      etat(`Erreur de chargement : ${e.message ?? e}`);
      $('charger').disabled = false;
      $('modele').disabled = false;
      return;
    }
  }
  // Premier passage à vide : le tout premier calcul est toujours plus lent.
  etat('Préchauffage…');
  await transcripteur(new Float32Array(16000), { language: 'french', task: 'transcribe' });
  $('barre').firstElementChild.style.width = '100%';
  etat(`Modèle prêt (calcul : ${calcul === 'webgpu' ? 'carte graphique' : 'processeur'}). Appuyez sur « Démarrer l'écoute ».`);
  $('micro').disabled = false;
};

// ---------- 2. Écoute et découpage en phrases ----------
const FREQ = 16000;
const SEUIL = 0.012;          // volume au-dessus duquel on considère qu'on parle
const SILENCE_FIN = 0.7;      // secondes de silence qui terminent une phrase
const MAX_PHRASE = 15;        // secondes max par phrase

let contexte = null, flux = null, noeud = null, enEcoute = false;
let morceaux = [], dureeParole = 0, silence = 0, parle = false;
const file = [];
let occupe = false;

$('micro').onclick = async () => {
  if (enEcoute) return arreter();
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 },
    });
  } catch (e) {
    etat('Micro refusé : autorisez le micro pour ce site.');
    return;
  }
  contexte = new AudioContext({ sampleRate: FREQ });
  const source = contexte.createMediaStreamSource(flux);
  noeud = contexte.createScriptProcessor(4096, 1, 1);
  noeud.onaudioprocess = (e) => traiterAudio(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(noeud);
  noeud.connect(contexte.destination);
  enEcoute = true;
  $('micro').textContent = 'Arrêter l\'écoute';
  $('micro').classList.add('actif');
  etat('À l\'écoute… parlez, puis marquez une pause.');
};

function arreter() {
  enEcoute = false;
  noeud?.disconnect();
  flux?.getTracks().forEach((t) => t.stop());
  contexte?.close();
  if (morceaux.length) terminerPhrase();
  $('micro').textContent = 'Démarrer l\'écoute';
  $('micro').classList.remove('actif');
  $('niveau').firstElementChild.style.width = '0';
  etat('Écoute arrêtée.');
}

function traiterAudio(bloc) {
  let somme = 0;
  for (const v of bloc) somme += v * v;
  const rms = Math.sqrt(somme / bloc.length);
  $('niveau').firstElementChild.style.width = `${Math.min(100, rms * 800)}%`;
  const duree = bloc.length / FREQ;

  if (rms > SEUIL) { parle = true; silence = 0; }
  else if (parle) { silence += duree; }

  if (parle) {
    morceaux.push(bloc);
    dureeParole += duree;
    if (silence >= SILENCE_FIN || dureeParole >= MAX_PHRASE) terminerPhrase();
  }
}

function terminerPhrase() {
  const total = morceaux.reduce((n, m) => n + m.length, 0);
  const audio = new Float32Array(total);
  let pos = 0;
  for (const m of morceaux) { audio.set(m, pos); pos += m.length; }
  const duree = dureeParole - silence;
  morceaux = []; dureeParole = 0; silence = 0; parle = false;
  if (duree < 0.4) return;    // bruit bref, ignoré

  const ligne = document.createElement('div');
  ligne.className = 'ligne attente';
  ligne.innerHTML = '<div class="texte">Transcription…</div><div class="mesure"></div>';
  $('sortie').prepend(ligne);
  file.push({ audio, duree, ligne, fin: performance.now() });
  void vider();
}

async function vider() {
  if (occupe) return;
  occupe = true;
  while (file.length) {
    const { audio, duree, ligne, fin } = file.shift();
    const debut = performance.now();
    let texte = '';
    try {
      const r = await transcripteur(audio, { language: 'french', task: 'transcribe' });
      texte = (r.text ?? '').trim();
    } catch (e) {
      texte = `Erreur : ${e.message ?? e}`;
    }
    const calculS = (performance.now() - debut) / 1000;
    const delaiS = (performance.now() - fin) / 1000;
    mesures.push({ duree, calculS, delaiS });
    ligne.classList.remove('attente');
    ligne.querySelector('.texte').textContent = texte || '(rien reconnu)';
    ligne.querySelector('.mesure').textContent =
      `Phrase de ${duree.toFixed(1)} s · affichée ${delaiS.toFixed(1)} s après la fin de la phrase`;
    resumer();
  }
  occupe = false;
}

function resumer() {
  const n = mesures.length;
  const moy = mesures.reduce((s, m) => s + m.delaiS, 0) / n;
  const max = Math.max(...mesures.map((m) => m.delaiS));
  $('resume').textContent =
    `${n} phrase(s) · délai moyen ${moy.toFixed(1)} s · délai max ${max.toFixed(1)} s · calcul : ${calcul === 'webgpu' ? 'carte graphique' : 'processeur'}`;
}
</script>
</body>
</html>
